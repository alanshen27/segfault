services:
  # Next.js community site
  - type: web
    name: segfault-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

  # Always-on Discord AI mentor
  - type: worker
    name: segfault-mentor-bot
    runtime: node
    plan: starter
    rootDir: bot
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DAILY_NEWS_CHANNEL_ID
        sync: false
      - key: RESOURCES_CHANNEL_ID
        sync: false
